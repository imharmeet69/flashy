<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>flash card app</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <h2>Flash Cards</h2>
    <div class="progress">
      <div class="loading"></div>
      <span class="percentage"></span>
      <span class="total"></span>
    </div>

    <div class="card">
      <div class="question-conatiner">
          <span class="question">
          </span>
      </div>
      <div class="carousel">
          <button class="button">
            Previous
          </button>

          <button class="button">
              Answer
          </button>

          <button class="button">
            Next
          </button>

          <button class="button" id="delete">
            Delete
          </button>
      </div>
    </div>
  </div>

  <div>
    If you wanna add more flash card. Click the button Add below
  </div>

  <a href="input.html">
     <button>Add</button>
  </a>
 
 

  <script src="script.js"></script>
</body>
</html>
