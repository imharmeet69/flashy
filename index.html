<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>flash card app</title>
  <link rel="stylesheet" href="css/style.css">
  <script>
    // Redirect root/index page to input.html so input form opens first (works for GitHub Pages)
    // BUT only redirect when there are no saved flashcards. If the user has created cards,
    // we avoid redirecting so they can see their deck after submitting the form.
    (function() {
      try {
        const path = location.pathname || '/';
        const saved = localStorage.getItem('flashcards');
        const hasCards = saved ? JSON.parse(saved).length > 0 : false;
        // Redirect only when at root/index and there are NO cards
        if ((path.endsWith('/') || path.endsWith('/index.html')) && !hasCards) {
          if (!location.pathname.endsWith('input.html')) {
            location.replace('input.html');
          }
        }
      } catch (e) {
        // If any error reading localStorage, fall back to redirecting to input
        if (location.pathname.endsWith('/') || location.pathname.endsWith('/index.html')) {
          if (!location.pathname.endsWith('input.html')) {
            location.replace('input.html');
          }
        }
      }
    })();
  </script>
</head>
<body>
  <div class="container">
    <h2>Flash Cards</h2>
    <div class="progress">
      <div class="loading"></div>
      <span class="percentage"></span>
      <span class="total"></span>
    </div>

    <div class="card">
      <div class="question-conatiner">
          <span class="question">
          </span>
      </div>
      <div class="carousel">
          <button class="button">
            Previous
          </button>

          <button class="button">
              Answer
          </button>

          <button class="button">
            Next
          </button>

          <button class="button" id="delete">
            Delete
          </button>
      </div>
    </div>
  </div>

  <div>
    If you wanna add more flash card. Click the button Add below
  </div>

  <a href="input.html">
     <button>Add</button>
  </a>
 
 

  <script src="script.js"></script>
</body>
</html>
