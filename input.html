<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flashy</title>
  <link rel="stylesheet" href="css/input.css">
</head>
<body>
  <div class="container">
    <h1>Hi! I am Flashy 👋</h1>
    <p>
      I am a simple flashcard app that helps you create and review questions and answers. 
      I’m just starting out, so my UI isn’t perfect yet 😅, but if you give me good feedback, 
      I’ll grow and become even better! Right now, I’m in the building stage. Let’s study together!
    </p>

    <!-- Flashcard input form -->
    <form id="flashcardForm" action="index.html">
      <input type="text" id="questionInput" placeholder="Enter your question" required>
      <br>
      <textarea id="answerInput" placeholder="Enter the answer" rows="4" required></textarea>
      <br>
      <button id="submit" type="submit">Add Flashcard</button>
    </form>
  </div>

  

  <script src="script.js"></script>
</body>
</html>
